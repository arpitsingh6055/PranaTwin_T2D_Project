services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      PRANATWIN_DATA_DIR: /var/lib/pranatwin
      # Set this in an environment file before any non-local deployment.
      PRANATWIN_API_KEY: ${PRANATWIN_API_KEY:-}
      # Optional administrator-configured smartwatch/IoT JSON GET endpoint.
      PRANATWIN_WEARABLE_API_URL: ${PRANATWIN_WEARABLE_API_URL:-}
      PRANATWIN_WEARABLE_API_KEY: ${PRANATWIN_WEARABLE_API_KEY:-}
    volumes:
      - pranatwin-data:/var/lib/pranatwin
    init: true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pranatwin-data:
